aid: payform
name: Payform
description: >-
  PayForm is a no-code payment form builder that lets creators and small
  businesses accept one-time and recurring credit-card payments without writing
  code. Users design customizable checkout forms with flexible fields, run
  recurring billing with trial periods and setup fees, and deliver digital
  content such as e-books, videos, and music through a members-only area. It
  supports 50+ currencies and 30+ languages, connects to the Stripe and PayPal
  payment gateways, and provides a subscriber self-service portal, Zapier
  automation to 2,000+ apps, and webhooks for custom integrations. Payform is a
  portfolio company of 500 Global.
